name: Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src/ados/plugins/_capabilities_generated.py"
      - "src/ados/plugins/_dispatch_generated.py"
      - "src/ados/services/wfb/_wfb_tables_generated.py"
      - "src/ados/core/_contracts_generated.py"
      # Rust tests assert against the shipped unit files (which units exist,
      # which one a UI reload signals). Without this, deleting a unit and
      # touching no crate never runs the gate written to catch exactly that.
      - "data/systemd/**"
      # Compiled into the binaries through include_str!. A change to any of
      # them must rebuild, retest and republish the prebuilt binaries, and
      # release.yml's RUST_PATHS must list the same set.
      - "src/ados/hal/boards/**"
      - "src/ados/data/plugin-catalog.json"
      - "src/ados/plugins/builtin/**/manifest.yaml"
      - "schemas/agent-config.schema.json"
      - "docs/api-surface.md"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "src/ados/plugins/_capabilities_generated.py"
      - "src/ados/plugins/_dispatch_generated.py"
      - "src/ados/services/wfb/_wfb_tables_generated.py"
      - "src/ados/core/_contracts_generated.py"
      # Rust tests assert against the shipped unit files (which units exist,
      # which one a UI reload signals). Without this, deleting a unit and
      # touching no crate never runs the gate written to catch exactly that.
      - "data/systemd/**"
      # Compiled into the binaries through include_str! (see the push filter).
      - "src/ados/hal/boards/**"
      - "src/ados/data/plugin-catalog.json"
      - "src/ados/plugins/builtin/**/manifest.yaml"
      - "schemas/agent-config.schema.json"
      - "docs/api-surface.md"
      - ".github/workflows/rust.yml"

# Default to read-only so the build-test job (which runs on pull requests, i.e.
# fork-controlled code) never holds a release-write token. Only the publish job
# elevates to contents: write, and it runs only on pushes to main.
permissions:
  contents: read

# One run per ref at a time, queued rather than cancelled. Every push to main
# moves the rolling `prebuilt-main` pointer; the publish job also refuses to move
# it backwards, so a queued run for an older commit can never repoint it.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: false

# Every asset a `rev-<sha>` release carries, declared once. The publish job
# refuses a run whose staged files differ from this list in either direction,
# and the installer's catalog test (crates/ados-installer/src/binaries.rs)
# requires it to equal the set an install fetches.
env:
  REV_ASSETS: >-
    ados-tui-aarch64
    ados-supervisor-aarch64
    ados-mavlink-router-aarch64
    ados-radio-aarch64
    ados-video-aarch64
    ados-camera-probe-aarch64
    ados-plugin-host-aarch64
    ados-cloud-aarch64
    ados-groundlink-aarch64
    ados-net-aarch64
    ados-pic-aarch64
    ados-input-aarch64
    ados-display-aarch64
    ados-display-probe-aarch64
    ados-oled-i2c-aarch64
    ados-vision-aarch64
    ados-swarmbus-aarch64
    ados-logd-aarch64
    ados-control-aarch64
    ados-gpio-aarch64
    ados-crsf-aarch64
    ados-tunnel-config-aarch64
    ados-clock-aarch64
    ados-sensorhub-aarch64
    ados-gnss-aarch64
    ados-lora-aarch64
    mediamtx-aarch64
    ados-vision-onnx-aarch64
    libonnxruntime-aarch64.so

defaults:
  run:
    working-directory: crates

jobs:
  build-test:
    # Native arm64 so the build and tests run on the same architecture as the
    # target boards (Rock 5C, Pi 4B); no cross-compile needed.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The static target the prebuilt binaries ship as. Linting against it
          # catches Linux/musl-only lints (nix, flock, setsid) the host target
          # cannot surface, so both targets are part of the code-ready gate.
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: arm64-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: arm64-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (host target, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Some crates carry bundled C (SQLite, zstd) and — via rustls in the
      # cloud relay and the plugin host's archive download — ring, whose
      # build script needs an aarch64-linux-musl C compiler. zig cc is that
      # compiler (the same tech cargo-zigbuild uses for the publish jobs);
      # exposing it under the target-triple name cc-rs looks for lets the musl
      # clippy build every crate's C without a per-crate exclude whack-a-mole.
      - name: Install zig (musl C cross-compiler for clippy build scripts)
        uses: mlugg/setup-zig@v2

      - name: Expose zig as the aarch64-linux-musl C toolchain
        run: |
          set -eu
          sudo tee /usr/local/bin/aarch64-linux-musl-gcc >/dev/null <<'EOF'
          #!/usr/bin/env bash
          # cc-rs passes --target=<rust-triple> (aarch64-unknown-linux-musl),
          # which zig's clang driver rejects (it wants its own arch-os-abi form).
          # Drop it; the -target below is the zig-form target for this cross build.
          args=()
          for a in "$@"; do
            [[ "$a" == --target=* ]] && continue
            args+=("$a")
          done
          exec zig cc -target aarch64-linux-musl "${args[@]}"
          EOF
          sudo tee /usr/local/bin/aarch64-linux-musl-ar >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec zig ar "$@"
          EOF
          sudo chmod +x /usr/local/bin/aarch64-linux-musl-gcc /usr/local/bin/aarch64-linux-musl-ar

      # The musl prebuilts ship default features. The onnx backend pulls ort,
      # which has no aarch64-musl prebuilt, so --all-features cannot target
      # musl; the host clippy above already covers the onnx path.
      - name: Clippy (aarch64-musl target, default features)
        # No per-crate excludes. ados-logd, ados-cloud and ados-plugin-host
        # were excluded because their bundled C (SQLite, zstd, and ring via
        # rustls) needs an
        # aarch64-linux-musl C compiler that clippy invokes through their
        # build scripts. The zig cross-cc shim installed in the two steps
        # directly above IS that compiler and runs before this step, so the
        # reason no longer holds.
        #
        # Worth naming what the excludes cost: ados-plugin-host owns the
        # flight-command capability gate and was getting no musl lint at all,
        # on the exact target the shipped binaries are built for.
        run: cargo clippy --all-targets --target aarch64-unknown-linux-musl --workspace -- -D warnings

      - name: Install ffmpeg (the RTSP decoder tests drive the real CLI)
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg

      - name: Test (default features)
        run: cargo test

      - name: Test (all features)
        run: cargo test --all-features

      - name: Root-only tests (run the built binary under sudo)
        run: |
          set -euo pipefail
          bin="$(cargo test -p ados-config --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "ados_config") | .executable' | tail -n1)"
          test -x "$bin"
          sudo "$bin" --ignored capture_group_member

      - name: Capability catalog + contract registry drift check
        run: cargo run -q -p ados-capabilities-codegen -- --check

      - name: Release build (arm64)
        run: cargo build --release --all-features

  # The workspace declares `rust-version = "1.88"`, and nothing ever built
  # against it. `dtolnay/rust-toolchain@stable` in the job above installs
  # whatever stable is today, so the declared floor was a claim in a manifest
  # rather than a tested property: any 2024-edition construct or a
  # newer-than-1.88 API would compile green here and then fail for a
  # contributor or a distro toolchain pinned at the declared minimum.
  #
  # The toolchain is read FROM the manifest rather than pinned here on
  # purpose. A second hard-coded version in CI is a second source of truth,
  # and the two drift silently in the direction that makes CI pass.
  msrv:
    name: MSRV (the declared rust-version actually builds)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Read and floor-check the declared MSRV
        id: msrv
        run: |
          set -uo pipefail
          V="$(sed -n 's/^rust-version *= *"\([0-9][0-9.]*\)".*/\1/p' Cargo.toml | head -1)"
          if [ -z "$V" ]; then
            echo "FAIL: crates/Cargo.toml declares no rust-version; this gate has nothing to enforce."
            exit 1
          fi

          # Hard floor. Dropping the declared minimum below this is a product
          # decision, not a build fix, and it must not happen by someone
          # editing a manifest line to make a build pass.
          FLOOR=1.88
          lowest="$(printf '%s\n%s\n' "$FLOOR" "$V" | sort -V | head -1)"
          if [ "$lowest" != "$FLOOR" ]; then
            echo "FAIL: declared rust-version $V is below the $FLOOR floor."
            exit 1
          fi

          # Self-test the comparison. `sort -V` silently degrades to a
          # lexicographic sort on a build without version sorting, which would
          # make the floor check above pass for anything.
          if [ "$(printf '1.9\n1.10\n' | sort -V | head -1)" != "1.9" ]; then
            echo "FAIL: sort -V is not version-sorting on this runner; the floor check cannot be trusted."
            exit 1
          fi

          echo "declared MSRV $V (floor $FLOOR)"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: arm64-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: arm64-msrv-${{ steps.msrv.outputs.version }}-

      - name: The whole workspace compiles on the declared minimum
        run: cargo check --workspace --all-targets

  # The Mac workstation path (`ados-installer` dispatching to its macOS
  # uninstall/status, and `ados-control`'s sysctl-backed hardware read) sits
  # behind `#[cfg(target_os = "macos")]`, which no Linux job compiles. Without
  # this a change that breaks it merges green and is found on a developer's Mac.
  macos-check:
    name: macOS-only code compiles
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: macos-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Check ados-installer and ados-control (all targets)
        run: cargo check -p ados-installer -p ados-control --all-targets

  # Release pipeline, run only on pushes to main:
  #
  #   prebuilt     one cached build of every service binary at this commit
  #   vision-onnx  the glibc onnx vision build (ONNX Runtime cannot link musl)
  #   publish      signs every asset, publishes them to `rev-<sha>`, then moves
  #                the one rolling pointer `prebuilt-main` to a manifest naming
  #                that commit plus every asset's digest and size
  #
  # An edge install reads `prebuilt-main/manifest.json` and fetches every asset
  # from the single `rev-<sha>` release it names, so a node never holds binaries
  # from two commits. A `--ref <sha>` install addresses `rev-<sha>` directly, and
  # release.yml copies a tagged release's binaries out of the nearest one.
  #
  # Uploads use the `gh` CLI with `--clobber`, which replaces one named asset at
  # a time. GH_REPO is named explicitly so the upload target never depends on
  # the CLI inferring one from a git remote.
  prebuilt:
    needs: build-test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    env:
      MEDIAMTX_VERSION: v1.17.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: musl-release

      # Bundled C (SQLite, zstd, and ring via rustls) needs an aarch64-musl C
      # compiler; cargo-zigbuild drives zig as that compiler for every crate.
      - name: Install zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # Static (musl) so one binary runs on every supported board regardless of
      # its glibc.
      - name: Build every service binary (static musl)
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl --workspace --bins --exclude ados-vision --exclude ados-capabilities-codegen

      # The default vision engine ships default features only; the onnx backend
      # has its own job below. Built on its own so its feature set is exactly
      # the crate's defaults, reusing the dependencies the step above compiled.
      - name: Build the default vision binary (static musl)
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p ados-vision --bin ados-vision

      # Self-hosting the upstream relay means an install never depends on a
      # third-party release staying available.
      - name: Stage binaries, the mirrored mediamtx, and checksums
        run: |
          set -euo pipefail
          out=target/aarch64-unknown-linux-musl/release
          mkdir -p rel installer work
          for asset in ${REV_ASSETS}; do
            case "$asset" in
              mediamtx-aarch64|ados-vision-onnx-aarch64|libonnxruntime-aarch64.so) continue ;;
            esac
            install -m 0755 "$out/${asset%-aarch64}" "rel/$asset"
          done
          url="https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_arm64.tar.gz"
          curl -fsSL --connect-timeout 10 --max-time 180 --retry 3 --retry-delay 2 "$url" -o work/mediamtx.tar.gz
          tar -xzf work/mediamtx.tar.gz -C work mediamtx
          install -m 0755 work/mediamtx rel/mediamtx-aarch64
          install -m 0755 "$out/ados-installer" installer/ados-installer-aarch64
          for dir in rel installer; do
            ( cd "$dir" && for f in *; do sha256sum "$f" > "$f.sha256"; done )
          done
          ls -l rel installer

      - name: Hand the binaries to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: rel-prebuilt
          path: crates/rel/
          if-no-files-found: error
          retention-days: 1

      # scripts/install.sh downloads the installer to bootstrap an install
      # before it can read any manifest, so it rides its own pointer.
      - name: Hand the installer to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: crates/installer/
          if-no-files-found: error
          retention-days: 1

  # Build the vision engine WITH the ONNX Runtime backend (--features onnx) as a
  # distinct asset the installer fetches for CPU-strong, NPU-less boards (those
  # whose board profile declares compute.local_inference: onnx). Unlike every
  # other prebuilt this is NOT a static musl binary: ONNX Runtime has no
  # aarch64-musl prebuilt, so this ships as a glibc (gnu) binary. Built natively
  # on ubuntu-22.04-arm so the glibc floor is 2.35, old enough for the target
  # boards' Debian 12 / Raspberry Pi OS Bookworm (glibc 2.36).
  #
  # The backend loads the ONNX Runtime dynamically (the crate's `load-dynamic`
  # feature), so the binary carries no link-time dependency on the runtime. The
  # runtime shared library is shipped separately: an official aarch64 build the
  # installer places at a fixed path and hands to the binary via ORT_DYLIB_PATH.
  # Its version must match the ABI the `ort` crate targets; bump it in lockstep
  # with the `ort` dependency. Signing happens in the publish job: minisign is
  # not packaged for this runner's apt.
  vision-onnx:
    needs: build-test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04-arm
    env:
      ORT_RUNTIME_VERSION: "1.24.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: gnu-onnx-release

      - name: Build ados-vision with the onnx backend (dynamic load)
        run: cargo build --release --features onnx -p ados-vision

      - name: Fetch the ONNX Runtime shared library (official aarch64 build)
        run: |
          set -euo pipefail
          ver="${ORT_RUNTIME_VERSION}"
          tarball="onnxruntime-linux-aarch64-${ver}.tgz"
          url="https://github.com/microsoft/onnxruntime/releases/download/v${ver}/${tarball}"
          curl -fSL --retry 3 -o "${tarball}" "${url}"
          tar -xzf "${tarball}"
          # The tarball ships lib/libonnxruntime.so.<ver> plus a versionless
          # symlink; publish the real (dereferenced) shared object.
          cp -L "onnxruntime-linux-aarch64-${ver}/lib/libonnxruntime.so" libonnxruntime-aarch64.so
          file libonnxruntime-aarch64.so

      - name: Stage artifacts + checksums
        run: |
          set -euo pipefail
          mkdir -p rel
          cp target/release/ados-vision rel/ados-vision-onnx-aarch64
          cp libonnxruntime-aarch64.so rel/libonnxruntime-aarch64.so
          ( cd rel && for f in *; do sha256sum "$f" > "$f.sha256"; done )

      - name: Hand the artifacts to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: rel-vision-onnx
          path: crates/rel/
          if-no-files-found: error
          retention-days: 1

  # Sign everything, publish `rev-<sha>` in one step, then move the pointer.
  #
  # Releases rather than run artifacts because the whole download stack on a
  # board is anonymous `curl -fsSL` (scripts/install.sh,
  # crates/ados-installer/src/net.rs), while GitHub's artifact-zip endpoint is
  # auth-only. The rev release is created as a draft, filled, then published,
  # so an anonymous reader never sees it half-uploaded.
  #
  # Cost, stated plainly: one prerelease per commit that touches the paths this
  # workflow filters on. Nothing prunes them yet.
  publish:
    needs:
      - prebuilt
      - vision-onnx
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      # Full history: the pointer move checks commit ancestry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect this run's binaries
        uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          path: crates/rev
          merge-multiple: true

      - name: Collect this run's installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: crates/installer

      - name: The staged set is exactly REV_ASSETS
        run: |
          set -euo pipefail
          want="$(printf '%s\n' ${REV_ASSETS} | sort)"
          have="$(cd rev && ls -1 | grep -v '\.sha256$' | sort)"
          if [ "$want" != "$have" ]; then
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$have") >&2 || true
            echo "::error::the staged assets differ from REV_ASSETS; refusing a partial rev-${GITHUB_SHA}"
            exit 1
          fi
          for a in ${REV_ASSETS}; do
            if [ ! -s "rev/$a.sha256" ]; then
              echo "::error::$a has no .sha256"
              exit 1
            fi
          done

      # agent_version is the agent package version this commit carries, so a
      # node can say which release line its binaries belong to.
      - name: Write the manifest
        run: |
          set -euo pipefail
          mkdir -p manifest
          python3 - <<'PY'
          import hashlib, json, os, re
          with open("../src/ados/__init__.py", encoding="utf-8") as f:
              version = re.search(r'^__version__\s*=\s*"([^"]+)"', f.read(), re.M).group(1)
          assets = {}
          for name in os.environ["REV_ASSETS"].split():
              path = os.path.join("rev", name)
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              assets[name] = {"sha256": h.hexdigest(), "size": os.path.getsize(path)}
          manifest = {"commit": os.environ["GITHUB_SHA"], "agent_version": version, "assets": assets}
          with open("manifest/manifest.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          ( cd manifest && sha256sum manifest.json > manifest.json.sha256 )
          cat manifest/manifest.json

      - name: Sign every asset (mandatory)
        env:
          SIGNING_KEY: ${{ secrets.ADOS_DRIVER_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY}" ]; then
            echo "ADOS_DRIVER_SIGNING_KEY is not set. Every install refuses a downloaded binary without a release-key signature, so nothing unsigned is published." >&2
            exit 1
          fi
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y minisign
          printf '%s' "${SIGNING_KEY}" > /tmp/sign.key
          for f in rev/* installer/* manifest/manifest.json; do
            case "$f" in *.sha256) continue ;; esac
            minisign -S -s /tmp/sign.key -m "$f" -x "$f.minisig"
          done
          rm -f /tmp/sign.key

      - name: Publish rev-<sha>
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="rev-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run of the same commit: same names, replaced one at a time.
            gh release upload "$tag" rev/* --clobber
          else
            gh release create "$tag" rev/* \
              --draft \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "ADOS binaries for ${GITHUB_SHA}" \
              --notes "Prebuilt binaries for commit ${GITHUB_SHA}, built in one job. prebuilt-main/manifest.json lists every asset's sha256 and size."
            gh release edit "$tag" --draft=false
          fi

      # The pointer only ever moves forward: a run for a commit that is an
      # ancestor of the one prebuilt-main already names leaves it alone.
      - name: Move the prebuilt-main pointer and the installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ptr=prebuilt-main
          if gh release view "$ptr" >/dev/null 2>&1; then
            rm -rf ptr-current && mkdir ptr-current
            if gh release download "$ptr" --pattern manifest.json --dir ptr-current; then
              current="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' ptr-current/manifest.json)"
              if [ "$current" != "${GITHUB_SHA}" ] && git merge-base --is-ancestor "${GITHUB_SHA}" "$current" 2>/dev/null; then
                echo "$ptr already names $current, a descendant of ${GITHUB_SHA}; leaving it"
                exit 0
              fi
            fi
          else
            gh release create "$ptr" --prerelease \
              --title "ADOS edge binaries (pointer)" \
              --notes "manifest.json names the rev-<sha> release every edge install fetches its binaries from."
          fi
          gh release upload "$ptr" manifest/manifest.json manifest/manifest.json.sha256 manifest/manifest.json.minisig --clobber
          gh release view prebuilt-installer >/dev/null 2>&1 || gh release create prebuilt-installer \
            --prerelease --title "Prebuilt ados-installer (rolling)" --notes ""
          gh release upload prebuilt-installer installer/* --clobber
