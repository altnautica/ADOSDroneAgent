[package]
name = "ados-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-call binary for the ADOS Drone Agent: one executable that runs any Rust daemon, selected by the name it is invoked under."

[[bin]]
name = "ados-agent"
path = "src/main.rs"

[dependencies]
# One allocator for every applet: mimalloc returns freed pages to the OS and
# bounds per-thread arena growth, which matters more once every daemon shares
# the same text pages and only the heap differs.
mimalloc = "0.1"
ados-cloud = { path = "../ados-cloud" }
ados-config-tunnel = { path = "../ados-config-tunnel" }
ados-control = { path = "../ados-control" }
ados-crsf = { path = "../ados-crsf" }
ados-display = { path = "../ados-display" }
ados-gpio = { path = "../ados-gpio" }
ados-groundlink = { path = "../ados-groundlink" }
ados-hal-probe = { path = "../ados-hal-probe" }
ados-hid = { path = "../ados-hid" }
ados-logd = { path = "../ados-logd" }
ados-mavlink-router = { path = "../ados-mavlink-router" }
ados-net = { path = "../ados-net" }
ados-plugin-host = { path = "../ados-plugin-host" }
ados-radio = { path = "../ados-radio" }
ados-supervisor = { path = "../ados-supervisor" }
ados-swarmbus = { path = "../ados-swarmbus" }
ados-video = { path = "../ados-video" }
