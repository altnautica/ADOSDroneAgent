[package]
name = "ados-clock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ados-clock"
readme = "README.md"
description = "Map remote clocks onto a host monotonic timebase: windowed least-squares and lower-envelope fits, NTP-style TIMESYNC estimation and a chrony SOCK refclock sink."
keywords = ["clock", "time-sync", "chrony", "timesync", "sensor-fusion"]
categories = ["date-and-time", "science::robotics", "embedded"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
