[package]
name = "ados-clock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host clock service: brokers the sensor bus (/run/ados/sensors.sock), fits every time source against the host monotonic clock, picks the session timebase, publishes clock samples, writes the clock and sensor-stream sidecars, and feeds a GNSS PPS lock to chrony."

[lib]
name = "ados_clock"
path = "src/lib.rs"

[[bin]]
name = "ados-clock"
path = "src/main.rs"

[dependencies]
# The producer-side log-shipping layer (feature-gated in ados-protocol) feeds
# the logging daemon's ingest socket alongside journald; never on the hot path.
ados-protocol = { path = "../ados-protocol", features = ["tracing-layer"] }
ados-sensorbus = { path = "../ados-sensorbus" }
anyhow = { workspace = true }
# Timestamp-only views of the bus payloads (the full messages are not decoded).
prost = "0.14"
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }
sd-notify = { workspace = true }

[dev-dependencies]
tempfile = "3"
