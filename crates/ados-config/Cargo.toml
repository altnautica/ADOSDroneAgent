[package]
name = "ados-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Loud-fail config loading for the agent services: parse a YAML config slice (or a JSON sidecar) and log the exact parser error on failure instead of silently defaulting, optionally handing the error back so a service can surface it on its status."

[dependencies]
serde = { workspace = true }
serde_norway = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
ados-protocol = { path = "../ados-protocol" }

# statvfs for the capture-storage volume listing; off Linux the space reader
# reports nothing and the pure core still builds and tests.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
