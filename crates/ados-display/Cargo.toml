[package]
name = "ados-display"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Display layer: the SPI-LCD page UI and render loop, the status OLED service, the boot-time display probe with apply-verify-auto-revert, and the panel input and sidecars."

[lib]
name = "ados_display"
path = "src/lib.rs"

[[bin]]
name = "ados-display"
path = "src/bin/ados-display.rs"

[[bin]]
name = "ados-display-probe"
path = "src/bin/ados-display-probe.rs"

[[bin]]
name = "ados-oled-i2c"
path = "src/bin/ados-oled-i2c.rs"

[[bin]]
name = "ados-kiosk"
path = "src/bin/ados-kiosk.rs"

[dependencies]
ados-display-driver = { workspace = true }
ados-hmi = { workspace = true }
# The button + touch gesture FSMs (pure, host-portable) the navigator drives
# the physical input from: front-panel press classification + touch strokes.
ados-hid = { path = "../ados-hid" }
# The node profile resolver (config `agent.profile`, then `profile.conf`) the
# panel page set keys on.
ados-config = { path = "../ados-config" }
# Process-group children (the kiosk compositor / browser) and bounded command
# runs (loginctl, systemctl, wlr-randr, pkill, ps).
ados-proc = { path = "../ados-proc" }
# The producer-side log-shipping layer (feature-gated in ados-protocol) feeds
# the logging daemon's ingest socket alongside journald; never on the hot path.
ados-protocol = { workspace = true, features = ["tracing-layer"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The agent config (`ground_station.ui.*`) the OLED contrast and the button
# mapping are read from.
serde_norway = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
time = { version = "0.3", features = ["std", "formatting", "local-offset"] }
# Blocking HTTP client for the agent's local REST API â€” the same source the
# Python LCD service polls at the configured cadence. HTTP-only (localhost),
# no TLS stack pulled in.
ureq = { workspace = true }
# LCD page rendering stack â€” all pure Rust, cross-builds for the musl SBC.
embedded-graphics = { workspace = true }
ab_glyph = { workspace = true }
image = { workspace = true }
qrcode = { workspace = true }
png = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }
sd-notify = { workspace = true }
# Touchscreen evdev reader (ADS7846). The `tokio` feature unlocks the async
# `EventStream` the touch reader drains in the daemon's select! loop. Only the
# node-open + read path is Linux-gated; the coordinate transform stays pure.
evdev = { version = "0.12", features = ["tokio"] }
# The passwd lookup that resolves a desktop session user's home and primary
# group before the kiosk window is dropped to that user.
nix = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Paused-clock tests for the touch recovery and the render-loop select bounds.
tokio = { workspace = true, features = ["test-util"] }
