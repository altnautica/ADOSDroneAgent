[package]
name = "ados-gnss-stream"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ados-gnss-stream"
readme = "README.md"
description = "Split a mixed UBX, NMEA and RTCM3 byte stream with resync, build u-blox VALSET commands and run an RTK base survey-in state machine."
keywords = ["gnss", "ubx", "rtcm", "rtk", "nmea"]
categories = ["parser-implementations", "embedded", "hardware-support", "aerospace::drones"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

