[package]
name = "ados-gpio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ados-gpio"
readme = "README.md"
description = "Drive a buzzer or LED on a Linux GPIO character-device line and compute bounded software-PWM beep schedules, as used by the ADOS Drone Agent."
keywords = ["gpio", "buzzer", "led", "pwm", "linux"]
categories = ["aerospace", "aerospace::protocols", "aerospace::unmanned-aerial-vehicles", "aerospace::drones", "hardware-support"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "ados_gpio"
path = "src/lib.rs"

[[bin]]
name = "ados-gpio"
path = "src/bin/ados-gpio.rs"

[dependencies]
# The producer-side log-shipping layer (feature-gated in ados-protocol) feeds
# the logging daemon's ingest socket alongside journald; never on the hot path.
ados-protocol = { workspace = true, features = ["tracing-layer"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }
sd-notify = { workspace = true }
# Pure-Rust character-device GPIO (no libgpiod C dependency), the same backend
# the front-panel button reader uses. Only the chip-open + line-write path is
# target-gated; the PWM/beep timing model and the command parser are
# host-portable and unit-tested without it.
gpio-cdev = "0.6"

[dev-dependencies]
tempfile = "3"
