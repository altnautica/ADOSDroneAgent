[package]
name = "ados-hal-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Probe-first hardware-capability detection: derives capabilities by reading real silicon (sysfs, device-tree, ioctl, sandboxed trial-init) rather than trusting declarations."

# The boot-time camera apply-verify-auto-revert oneshot. A binary rather than a
# library call because it has to run BEFORE the supervisor, from a
# `ConditionPathExists`-gated systemd oneshot, on a boot where the camera may
# not exist at all.
[[bin]]
name = "ados-camera-probe"
path = "src/bin/ados-camera-probe.rs"

[dependencies]
ados-protocol = { path = "../ados-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
# The board-profile YAMLs are embedded and parsed here so a zero-Python node can
# still resolve its real board instead of degrading to unknown / npu_tops 0.
serde_norway = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# The probe binary's own log sink (journald is picked up by the unit's
# StandardOutput=journal, so the plain fmt layer is enough here).
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = "3"
