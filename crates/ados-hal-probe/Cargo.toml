[package]
name = "ados-hal-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ados-hal-probe"
readme = "README.md"
description = "Probe-first hardware capability detection for Linux single-board computers: CPU, SoC, USB, serial, V4L2 encoders and board profiles, read from the real silicon by the ADOS Drone Agent."
keywords = ["hardware", "probe", "sbc", "v4l2", "drone"]
categories = ["aerospace", "aerospace::protocols", "aerospace::unmanned-aerial-vehicles", "aerospace::drones", "hardware-support"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

# The boot-time camera apply-verify-auto-revert oneshot. A binary rather than a
# library call because it has to run BEFORE the supervisor, from a
# `ConditionPathExists`-gated systemd oneshot, on a boot where the camera may
# not exist at all.
[[bin]]
name = "ados-camera-probe"
path = "src/bin/ados-camera-probe.rs"

[dependencies]
ados-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The board-profile YAMLs are embedded and parsed here so a zero-Python node can
# still resolve its real board instead of degrading to unknown / npu_tops 0.
serde_norway = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# The probe binary's own log sink (journald is picked up by the unit's
# StandardOutput=journal, so the plain fmt layer is enough here).
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = "3"
