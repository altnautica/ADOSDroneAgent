[package]
name = "ados-macpin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable-MAC pinning for network adapters with no efuse MAC that randomize their address each boot: a chipset quirk table, deterministic per-board MAC derivation, and a systemd-networkd .link provisioner. Shared by the installer step and the supervisor reconciler."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
# The two entry points an axum handler reaches (`apply_live`, `remove_pin_link`)
# spawn `ip` / `udevadm`; they run bounded under tokio::process so a wedged
# netlink or udev settle cannot block the control-plane reactor.
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
