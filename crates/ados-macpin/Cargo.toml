[package]
name = "ados-macpin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ados-macpin"
readme = "README.md"
description = "Stable MAC addresses for Linux network adapters that randomize theirs every boot: chipset quirk table, deterministic per-machine derivation and systemd-networkd .link files."
keywords = ["mac-address", "networkd", "wifi", "linux", "systemd"]
categories = ["os::linux-apis", "network-programming", "hardware-support"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# The shared atomic writer (`ados_protocol::sidecar::write_atomic`) the state
# file and the .link files go through.
ados-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
# The two entry points an axum handler reaches (`apply_live`, `remove_pin_link`)
# spawn `ip` / `udevadm`; they run bounded under tokio::process so a wedged
# netlink or udev settle cannot block the control-plane reactor.
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
