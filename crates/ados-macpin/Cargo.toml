[package]
name = "ados-macpin"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ados-macpin"
readme = "README.md"
description = "Stable MAC addresses for Linux network adapters that randomize theirs every boot: chipset quirk table, deterministic per-machine derivation and systemd-networkd .link files."
keywords = ["mac-address", "networkd", "wifi", "linux", "systemd"]
categories = ["aerospace", "aerospace::protocols", "aerospace::unmanned-aerial-vehicles", "aerospace::drones", "os::linux-apis"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Temp-file names for the atomic state and .link writes.
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
# The two async entry points (`apply_live`, `remove_pin_link`) spawn `ip` /
# `udevadm` bounded under tokio::process, so a wedged netlink call or udev
# settle cannot block the caller's reactor.
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
