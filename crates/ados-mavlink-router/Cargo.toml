[package]
name = "ados-mavlink-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owns the flight-controller serial link, fans MAVLink frames to the IPC socket, and produces the vehicle-state snapshot on the state socket."

[dependencies]
ados-protocol = { path = "../ados-protocol", features = ["mavlink", "tracing-layer"] }
ados-config = { path = "../ados-config" }
# Onboard swarm autonomy. The control laws live there and stay pure; this
# crate supplies the FC link they command through and the swarm-socket feed.
ados-swarm-control = { path = "../ados-swarm-control" }
# For the beacon `status` bit layout the autonomy status block encodes into.
ados-swarmbus = { path = "../ados-swarmbus" }
# The attitude rung's pure control laws (body-rate/thrust command set).
ados-rate-control = { path = "../ados-rate-control" }
# The PIC-verdict authority half the attitude rung's precedence gate consults
# (ground-profile, so the same verdict propagates over every bearer).
ados-hid = { path = "../ados-hid" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
tokio = { workspace = true }
tokio-serial = "5.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
time = { version = "0.3", features = ["std", "formatting"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Explicit SO_RCVBUF on the aux-uplink socket, so the relay-proxy Request lane's
# burst tolerance is this crate's own contract rather than a side effect of the
# installer's video sysctl. socket2 is pure Rust (libc only, no C build), so it
# cross-compiles to the musl SBC target cleanly.
socket2 = { version = "0.5", features = ["all"] }

[dev-dependencies]
tempfile = "3"
# Paused-clock harness for the FC-write-timeout test, which must not spend a
# real half-second. Dev-only: resolver 2 keeps test-util out of the shipped
# binary's features.
tokio = { workspace = true, features = ["test-util"] }

# Linux-only: the G3 hardware gate opens the FC's `/dev/ttyACM*` directly, and a
# CDC-ACM tty comes up in CANONICAL mode — `read()` blocks for a newline and
# `ICRNL` rewrites 0x0D to 0x0A inside binary MAVLink frames. Both make the
# gate's telemetry-echo assertion measure garbage. `nix::sys::termios` puts the
# port in raw mode with a bounded VMIN/VTIME read, which is what makes the
# assertion honest. Dev-only and target-gated, matching the crate's Linux-only
# device path; the file still compiles on a non-Linux dev host.
[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { workspace = true }
