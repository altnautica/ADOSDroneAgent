[package]
name = "ados-offload"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ados-offload"
readme = "README.md"
description = "Decide where drone perception runs (onboard, offloaded or hybrid) and gate stale or link-lost results so the vehicle holds instead of extrapolating."
keywords = ["drone", "offload", "perception", "slam", "safety"]
categories = ["aerospace", "aerospace::protocols", "aerospace::unmanned-aerial-vehicles", "aerospace::drones", "science::robotics"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "ados_offload"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
