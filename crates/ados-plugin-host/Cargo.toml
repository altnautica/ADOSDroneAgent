[package]
name = "ados-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plugin RPC host: serves a per-plugin Unix socket, verifies the capability token at handshake, and gates each request on its required capability before routing to a host service."

# The crate is lib + daemon binary. The lib is the host wiring; the binary is
# the runnable daemon that serves the enabled subprocess plugins.
[[bin]]
name = "ados-plugin-host"
path = "src/bin/ados-plugin-host.rs"

[dependencies]
# The wire (frame + envelope + capability token) lives in ados-protocol and is
# byte-parity tested against the Python supervisor. This crate speaks it
# unchanged; it never re-implements the framing or the token. The `mavlink`
# feature pulls in the guided-setpoint builder + the v2 serializer the host uses
# to turn a validated setpoint request into the exact SET_POSITION_TARGET frame
# it writes to the MAVLink socket (the same codec the router and the native
# command surface build their FC frames with), so a setpoint this host emits is
# byte-identical to one any other surface would.
ados-protocol = { path = "../ados-protocol", features = ["tracing-layer", "mavlink"] }
# The compute-offload HTTP client (submit/dataset/read/cancel/outputs). The host
# forwards a plugin's gated `compute.*` calls to its paired compute node through
# this client; it never re-implements the job API.
ados-compute = { path = "../ados-compute" }
# The PIC arbiter's sidecar read and injector-refusal decision, shared with the
# router's FC-write gate. With injector arbitration armed the host checks it
# before queueing a command, so a plugin reads `pic_refused` for the command the
# router would drop rather than a `sent` it never got.
ados-hid = { path = "../ados-hid" }
# The node profile (`drone | ground-station | workstation | compute`) the
# lifecycle controller gates `agent.target_profiles`, per-profile services and
# payloads against, resolved from the same config and profile.conf every
# daemon reads.
ados-config = { path = "../ados-config" }
# `node.info` reads each node fact through the reader its owning crate
# publishes: the HAL board sidecar's, and the video pipeline's camera-state
# sidecar and primary-stream config resolution. Reading them here rather than
# re-parsing the files keeps the answer identical to what the agent acts on.
ados-hal-probe = { path = "../ados-hal-probe" }
ados-video = { path = "../ados-video" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# JSON Schema (Draft-07) value validation: the agent's half of the shared
# parameter validator, so a config write is checked against the plugin's
# declared schema before it is persisted — never trusting the GCS form.
jsonschema = "0.18"
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
# Lifecycle additions: archive parse, the canonical payload hash, Ed25519
# signature verify, and the YAML manifest model. These power the install/
# enable/disable/remove controller and the .adosplug reader; the crate stays
# lib-only and never spawns a process from a test.
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
zip = { workspace = true }
serde_norway = { workspace = true }
# OS RNG for the persisted HMAC issuer secret (32 bytes, owner-only on disk).
# The shared secret lets a runner spawned by a separate systemd unit present a
# token the daemon can verify; a per-process random secret could not.
getrandom = { workspace = true }
# Non-poisoning mutex for the recording service backend's call log.
parking_lot = { workspace = true }
# Allowlisted HTTPS download of plugin archives and install-time payloads
# (`download.rs`): a blocking client on rustls with the ring provider and the
# bundled webpki roots, the one TLS posture the agent's other HTTPS clients use.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-manual-roots-no-provider",
    "blocking",
] }

# Unix edge: the advisory file lock around the state read-modify-write and the
# socket-dir owner check (Linux and macOS alike, since the plugin host runs on
# both).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

# Linux-only edge: the daemon's systemd readiness/watchdog notify + journald
# log layer. Confined to a target section so the core still builds and tests on
# a macOS host, where neither exists.
[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { workspace = true }
tracing-journald = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Test-only: serve the ados-compute job-API router over loopback so the
# compute-offload host route can be driven end-to-end against a real client.
axum = { workspace = true }
# Paused-clock harness for the telemetry pacing test, which asserts gaps and
# a newest-wins coalesce without spending real seconds. Dev-only: resolver 2
# keeps test-util out of the shipped binary's features.
tokio = { workspace = true, features = ["test-util"] }
