# ADOS IPC contract + sidecar version registry — single source of truth.
#
# Every inter-process wire contract and every on-disk state sidecar carries a
# version integer. This file is the one place those versions live, so the Rust,
# Python, and TypeScript sides can never disagree on a contract's version.
#
# Codegen (`cargo run -p ados-capabilities-codegen`) emits, from this file:
#   - Rust:   crates/ados-protocol/src/contracts.rs
#   - Rust:   crates/ados-protocol/src/paths.rs (the runtime path registry)
#   - Python: src/ados/core/_contracts_generated.py
#   - Python: src/ados/core/_paths_generated.py (the runtime path registry)
#   - TS:     ADOSMissionControl/src/lib/plugins/contracts.generated.ts
#
# Three sections:
#   [[contract]] — a versioned inter-process wire contract.
#   [[sidecar]]  — a versioned on-disk state sidecar (a JSON file one service
#                  writes and another reads).
#   [[socket]]   — a Unix socket under the run directory and the service that
#                  binds it.
#
# Fields:
#   id          — stable contract/sidecar/socket identifier.
#   version     — the version integer. For `status = "metadata"` contracts this
#                 is informational (0 = no registry-managed on-wire integer).
#   wire        — the on-wire encoding (msgpack | json | binary | ...).
#   transport   — how it travels (a socket kind, "shared-memory", ...).
#   status      — "active" (a live versioned contract), "sidecar" (a state
#                 file), or "metadata" (a primitive / external / legacy surface
#                 with no registry-managed on-wire integer).
#   rust_const  — the Rust source-of-truth constant, for provenance (optional).
#   description — one line on what the contract carries.
#   path        — (sidecar, socket) the default absolute path. A path under
#                 /run/ados resolves under the `ADOS_RUN_DIR` override at
#                 runtime; a `<placeholder>` segment marks a per-instance name.
#   max_age_ms  — (sidecar, optional) the freshness window: a file whose mtime
#                 is older than this is stale. Omitted for a sidecar that is
#                 written on change or persists state, where mtime is not age.
#   writer      — (sidecar) the service that writes the file.
#   owner       — (socket) the service that binds the socket.
#
# The version integers here mirror the constants in crates/ados-protocol/src.
# When a contract's on-wire shape changes, bump both the constant and this file
# in the same change, and regenerate. Do not edit the generated files by hand.
#
# Every sidecar a crate names by literal (`run_dir().join("x.json")` or
# "/run/ados/x.json") must have a row here; the ados-protocol
# `sidecar_registry_scan` test enforces it.

# ===========================================================================
# CONTRACTS — versioned inter-process wire contracts
# ===========================================================================

[[contract]]
id = "plugin.rpc"
version = 1
wire = "msgpack"
transport = "unix-stream"
status = "active"
rust_const = "ados_protocol::plugin::PROTOCOL_VERSION"
description = "Plugin RPC envelope: msgpack short-key request/response plus a pipe-delimited HMAC-SHA256 capability token."

[[contract]]
id = "logd.ingest"
version = 1
wire = "msgpack"
transport = "unix-socket"
status = "active"
rust_const = "ados_protocol::logd::WIRE_VERSION"
description = "Black-box ingest frames: logs, telemetry, discrete events, and hardware snapshots."

[[contract]]
id = "logd.read"
version = 1
wire = "json"
transport = "http"
status = "active"
rust_const = "ados_protocol::logd::ENVELOPE_VERSION"
description = "Black-box read-API request and response envelope."

[[contract]]
id = "framebus.ring"
version = 1
wire = "binary"
transport = "shared-memory"
status = "active"
rust_const = "ados_protocol::framebus::RingLayout::VERSION"
description = "Shared-memory vision frame ring layout: a header plus seqlock-guarded slots."

[[contract]]
id = "framebus.descriptor"
version = 1
wire = "msgpack"
transport = "event-bus"
status = "active"
description = "The small vision.frame descriptor naming a ring slot and its frame geometry."

[[contract]]
id = "tap.frame"
version = 1
wire = "binary"
transport = "unix-stream"
status = "active"
rust_const = "ados_protocol::tap::TAP_CONTRACT_VERSION"
description = "Vision-tap frame header (ADVT magic) between the video pipeline and the vision engine."

[[contract]]
id = "vision.detection"
version = 2
wire = "msgpack"
transport = "event-bus"
status = "active"
description = "Self-describing detection/percept batches published on the vision.detection topic (v2 adds optional mask, keypoints, depth, world position, and an optional 2D box)."

[[contract]]
id = "state.v2"
version = 4
wire = "msgpack"
transport = "unix-stream"
status = "active"
# EXACT-MATCH / STRICT LOCKSTEP. Both readers compare `version != <this>` and
# skip the frame on ANY mismatch (Rust `state::decode_v2`, Python
# `ados.core.ipc._decode_state_v2_body`); neither tolerates an unknown key. So
# EVERY change to the body shape MUST bump this integer, including a purely
# additive one. Adding a field without bumping produces two different payload
# shapes wearing the same version number, which is worse than the restart-window
# flag day a bump costs: the flag day is loud and bounded, whereas a silent
# version is a permanent ambiguity no reader can detect, and a registry whose
# version does not move when the shape moves has stopped meaning anything.
#
# The id names the FRAMING generation (length-prefixed msgpack, superseding the
# newline-JSON state.v1); the integer is the registry version of the body shape
# and moves independently of it.
description = "Length-prefixed msgpack vehicle-state frame (the current state-socket format). v3 added position_age_ms (how long since the flight controller's last decoded POSITION, read by the swarm beacon's suppression gate). v4 publishes a not-reported reading (battery voltage/current/remaining/temperature, GPS eph/epv, RC rssi) as null instead of the MAVLink sentinel. The runtime extras carry `fc_system_id`/`fc_component_id` once the FC heartbeat is latched."

[[contract]]
id = "frame"
version = 0
wire = "binary"
transport = "unix-stream"
status = "metadata"
description = "The 4-byte big-endian length transport primitive shared by plugin.rpc, the MAVLink socket, and state.v2. No version of its own."

[[contract]]
id = "mavlink.socket"
version = 0
wire = "binary"
transport = "unix-stream"
status = "metadata"
description = "MAVLink frame broadcast socket; framing versioning defers to external MAVLink v1/v2."

[[contract]]
id = "mavlink.ingest"
version = 0
wire = "binary"
transport = "unix-stream"
status = "metadata"
description = "Off-board MAVLink frames into a node's republish fan-out; the opposite direction to mavlink.socket, and versioned by external MAVLink v1/v2 the same way."

[[contract]]
id = "aux.frame"
version = 1
wire = "binary"
transport = "udp"
status = "active"
rust_const = "ados_protocol::aux_mux::AUX_VERSION"
description = "Auxiliary radio lane multiplex header (magic, version, channel, length) letting MAVLink, status, and identity share one datagram pipe."

[[contract]]
id = "aux.node_status"
version = 2
wire = "msgpack"
transport = "udp"
status = "active"
rust_const = "ados_protocol::node_status::NODE_STATUS_VERSION"
description = "Compact node status and identity carried on the auxiliary lane's status and identity channels, so a ground station can describe the node it relays."

[[contract]]
id = "aux.link_feedback"
version = 1
wire = "binary"
transport = "udp"
status = "active"
rust_const = "ados_protocol::link_feedback::LINK_FEEDBACK_VERSION"
description = "Ground-measured video-link quality reported back to the transmitting drone, so its adaptive bitrate ladder steps on a real loss sample instead of the sentinel a transmit-only radio can never leave."

[[contract]]
id = "state.v1"
version = 1
wire = "newline-json"
transport = "unix-stream"
status = "metadata"
description = "Legacy newline-terminated JSON vehicle-state frame; superseded by state.v2. No on-wire version integer."

[[contract]]
id = "ws_ticket"
version = 1
wire = "string"
transport = "websocket-subprotocol"
status = "metadata"
rust_const = "ados_protocol::ws_ticket::TICKET_KEY_LABEL"
description = "String-tagged (v2) single-use HMAC-SHA256 WebSocket auth ticket; the version is a string tag, not a wire integer."

[[contract]]
id = "cloud-publish"
version = 1
wire = "msgpack"
transport = "unix-stream"
status = "active"
rust_const = "ados_protocol::cloud_publish::CLOUD_PUBLISH_VERSION"
description = "Plugin data leaving the node through the cloud relay: the plugin host forwards a gated stream message (QoS 0 broker publish) or keyed JSON record (cloud record upsert) to ados-cloud over a root-only socket, one length-prefixed msgpack request and reply per exchange."

