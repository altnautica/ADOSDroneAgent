[package]
name = "ados-sensorhub-service"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sensor hub service: reads the hub's COBS/CRC packet stream over USB CDC or TCP, maps hub time onto the host monotonic clock, publishes IMU, trigger, barometer, magnetometer, GNSS and sync frames on the sensor bus, forwards RTCM to the hub, and writes the sensorhub sidecar."

[lib]
name = "ados_sensorhub_service"
path = "src/lib.rs"

[[bin]]
name = "ados-sensorhub"
path = "src/main.rs"

[dependencies]
ados-clock = { workspace = true }
# The producer-side log-shipping layer (feature-gated in ados-protocol) feeds
# the logging daemon's ingest socket alongside journald; never on the hot path.
ados-protocol = { workspace = true, features = ["tracing-layer"] }
ados-config = { path = "../ados-config" }
# The sysfs tty walk shared with the board probe (`transport: auto`).
ados-hal-probe = { workspace = true }
ados-sensorbus = { path = "../ados-sensorbus" }
ados-sensorhub = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# USB CDC-ACM port. Declared per-crate (not a workspace dep), matching the
# other serial consumers in the workspace.
tokio-serial = "5.4"

[dev-dependencies]
proptest = "1"
tempfile = "3"
