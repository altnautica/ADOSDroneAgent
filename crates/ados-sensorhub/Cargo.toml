[package]
name = "ados-sensorhub"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# MIT only, unlike the MIT OR Apache-2.0 crates: the sensor-hub firmware and
# the simulator link this crate, so it keeps the licence it shipped under and
# stays dependency-free.
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ados-sensorhub"
readme = "README.md"
description = "Sensor hub wire protocol: COBS framing, CRC-16/CCITT-FALSE and fixed-layout IMU, barometer, magnetometer, trigger, PPS and GNSS packets. no_std, no allocation."
keywords = ["cobs", "crc", "imu", "sensor", "no-std"]
categories = ["embedded", "no-std", "no-std::no-alloc", "encoding", "aerospace::protocols"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "ados_sensorhub"
path = "src/lib.rs"

[features]
default = []
# Derive serde Serialize/Deserialize on the owned packet structs.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
