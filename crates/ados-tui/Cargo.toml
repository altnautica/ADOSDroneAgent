[package]
name = "ados-tui"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal dashboard for the ADOS Drone Agent, launched by `ados` with no subcommand."

[[bin]]
name = "ados-tui"
path = "src/main.rs"

[dependencies]
ados-protocol = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tachyonfx = { workspace = true }
tui-input = { workspace = true }
nucleo-matcher = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Signal disposition around a shelled-out quick action (via nix::libc), so a
# Ctrl-C used to stop a streaming child exits the child, not this cockpit.
nix = { workspace = true }
