# ADOS vision shared-memory frame rings
#
# Each camera ring is a /dev/shm file, i.e. resident tmpfs RAM. The engine
# unlinks its rings on a clean exit, but Drop does not run on SIGKILL, an
# OOM-kill or an abort, and a camera that re-enumerates under a new /dev/videoN
# mints a ring under a new name — either way the old mapping holds RAM until
# something unlinks it. systemd-tmpfiles reclaims them at boot; the unit's
# ExecStartPre covers a restart inside one boot.
r! /dev/shm/ados-vision-*
