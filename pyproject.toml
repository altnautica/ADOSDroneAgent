[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ados-drone-agent"
# Version is read from src/ados/__init__.py via attr lookup so pip
# metadata and `ados version` always agree.
dynamic = ["version"]
description = "ADOS Drone Agent — Software-defined drone network agent"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Altnautica", email = "team@altnautica.com" }
]
keywords = ["drone", "mavlink", "ardupilot", "companion-computer", "fleet-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pymavlink>=2.4.41",
    # fastapi>=0.135 is the floor that accepts the modern starlette 1.x line.
    # Older fastapi (<=0.116) caps starlette<0.48; if a stray starlette 1.x ends
    # up in such an env, every APIRouter() raises at import time (starlette 1.x
    # dropped the on_startup/on_shutdown kwargs fastapi passed through). Pinning
    # the fastapi floor past that cap and bracketing starlette to the 1.x major
    # keeps the pair coherent on a clean resolve.
    "fastapi>=0.135.0",
    "starlette>=1.0.0,<2.0",
    "uvicorn[standard]>=0.27.0",
    "paho-mqtt>=2.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "websockets>=12.0",
    "structlog>=24.0.0",
    "pyserial>=3.5",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "zeroconf>=0.131.0",
    "jinja2>=3.0.0",
    # Required at runtime by ados.api.routes.plugins, which declares a
    # Form(...) parameter for the .adosplug upload endpoint. FastAPI
    # raises at module import time if this is missing.
    "python-multipart>=0.0.6",
    # msgpack is the IPC wire format (ados.core.ipc plus the plugin and
    # Rust-service sockets) — a hard runtime requirement, not optional. On the
    # legacy boards it happened to be satisfied by the system python3-msgpack
    # the venv's --system-site-packages exposed; a provisioned interpreter
    # (e.g. Python 3.11 where the system python is older and invisible to the
    # venv) has no such fallback, so `import msgpack` fails unless declared here.
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
# Floors here are not "roughly recent" — each is the oldest version at which the
# gate below still means what it is written to mean. A floor years under the
# version a gate is verified against makes the gate's verdict depend on which
# resolve a contributor happened to get.
dev = [
    # pytest-asyncio 1.x declares `pytest>=8.4,<10`. With a 7.4 floor a resolver
    # is free to satisfy `pytest` at 7.4 and then back-solve pytest-asyncio down
    # to a 0.x that accepts it — silently changing what `asyncio_mode = "auto"`
    # does to the whole suite. Floor the pair together instead.
    "pytest>=8.4.0",
    # 1.0 is where auto-mode's fixture event-loop scoping settled and the 0.x
    # compatibility behaviours were removed. Below it, the
    # `asyncio_mode = "auto"` line in [tool.pytest.ini_options] configures
    # different semantics than the suite is written against.
    "pytest-asyncio>=1.0.0",
    # ruff is the only gate over the Python half, and it is pre-1.0: rule
    # behaviour moves between minors with no stability promise. 0.15 is the
    # coherence floor for this file's own config — UP042 (in the `ignore` list
    # below) did not exist before 0.3.6 and stayed preview-only until 0.15, so
    # under any earlier ruff that entry is either an unknown code or inert while
    # `select = ["UP"]` is on.
    "ruff>=0.15",
    "mypy>=1.8.0",
]
# Ground-station profile extras. Pulled only when the installer detects
# the ground_station profile or when a developer runs
# `pip install -e ".[ground-station]"`. The drone profile never needs these.
ground-station = [
    "gpiozero>=2.0",
    "dbus-next>=0.2.3",
    "smbus2>=0.4.3",
    "evdev>=1.6.1",
    # Pillow is used by the video local-tap, which decodes the keyframe
    # JPEG snapshot the GCS preview reads. Pinned explicitly so the
    # dependency graph stays stable across the ground-station extra.
    "Pillow>=10.0.0",
]
# Vision inference extras. The RKNN and TensorRT inference sidecars
# import numpy lazily on the real infer path; pulled only when a
# vision-capable build needs on-device detection. Kept out of the base
# and drone installs so the default footprint stays small.
vision = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://altnautica.com/drone-agent"
Repository = "https://github.com/altnautica/ADOSDroneAgent"
Documentation = "https://docs.altnautica.com/drone-agent"
Issues = "https://github.com/altnautica/ADOSDroneAgent/issues"

[project.scripts]
ados = "ados.cli.main:cli"
ados-agent = "ados.core.main:main"
ados-plugin-runner = "ados.plugins.runner:main"

[project.entry-points."ados.plugins"]
geofence = "ados.plugins.builtin.geofence"
telemetry-logger = "ados.plugins.builtin.telemetry_logger"
mavlink-inspector = "ados.plugins.builtin.mavlink_inspector"

# Peripheral Manager plugin group. External OEM partners contribute
# manifests via entry points or filesystem drop-in.
[project.entry-points."ados.peripherals"]

[tool.setuptools.dynamic]
version = {attr = "ados.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ados*"]

[tool.setuptools.package-data]
"ados.hal" = ["boards/*.yaml"]
"ados.core" = ["defaults.yaml"]
"ados.dashboard" = ["static/**/*"]
"ados.cockpit" = ["static/**/*"]
"ados.data" = ["*.json"]


[tool.ruff]
target-version = "py311"
line-length = 100
# Generated by ados-capabilities-codegen from capabilities.toml; the catalog
# descriptions are long single-line strings that intentionally exceed the
# line-length limit. Edit the TOML and regenerate, never this file.
# `vendor/` holds third-party driver and radio sources carried verbatim; their
# style is upstream's to set, so linting them produces noise, not signal.
extend-exclude = [
    "src/ados/plugins/_capabilities_generated.py",
    "vendor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "UP017",  # datetime.UTC requires Python 3.12+, we target 3.11
    "E501",   # line-too-long: line length is left to the formatter, not the linter
    "E402",   # module-import-not-at-top: several modules import after a re-export
              # loop or doc block on purpose (e.g. ground_station package router
              # aggregation, plugins.supervisor circular-import guard)
    "N818",   # exception names without an Error suffix are part of the public API
              # (CmdTimeout, CapabilityDenied, TokenInvalid, ...); renaming breaks callers
    "N806",   # uppercase locals are deliberate function-scoped constants (SLEEP_S, ...)
    "N805",   # first-arg name: inner helper classes use _self to avoid shadowing self
    "N802",   # function name casing: a few test helper factories use PascalCase on purpose
    "N814",   # camelcase-imported-as-constant: intentional short aliases (Path as _P)
    "N815",   # mixed-case class attrs map to serialized wire field names (lastModified)
    "UP042",  # replace-str-enum: str-enum modernization deferred (behavior-sensitive)
]

[tool.mypy]
python_version = "3.11"
strict = true

# Third-party modules that ship no type information, or that are optional
# extras absent from a base install. Without this, a large share of every
# mypy run is "Library stubs not installed for X" — noise that says nothing
# about this codebase, and worse, noise whose VOLUME depends on which optional
# extras happen to be installed. That made the error count unusable as a
# regression signal, which is one reason mypy was configured and then never
# run by any gate.
#
# This suppresses only the import resolution. Everything reached through these
# modules is still checked at strict settings.
[[tool.mypy.overrides]]
module = [
    "yaml",
    "yaml.*",
    "psutil",
    "msgpack",
    "jsonschema",
    "jsonschema.*",
    "piexif",
    "numpy",
    "numpy.*",
    "PIL",
    "PIL.*",
    "pycuda",
    "pycuda.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
