id: com.example.corpus
version: 1.0.0
name: Corpus Example
risk: low
compatibility:
  ados_version: ">=0.1.0,<99.0.0"
agent:
  entrypoint: bin:corpus
  runtime: rust
  isolation: subprocess
  binaries:
    corpus:
      x86_64-linux: bin/x86_64/corpus
  payloads:
    - path: lib/x86_64/runtime
      source: https://example.com/runtime-x86_64.zip
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      size_bytes: 1024
      arch_os: x86_64-linux
      unpack: zip
