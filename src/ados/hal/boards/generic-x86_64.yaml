name: "generic-x86_64"
vendor: "unknown"
soc: "unknown"
arch: "x86_64"
model_patterns: []
default_tier: 2
gpio_pins: []
uart_paths:
  - /dev/ttyACM0
  - /dev/ttyUSB0
  - /dev/ttyS0
hw_video_codecs: []

# Unknown x86_64 host (a PC, mini-PC, or VM). No CSI and no hardware
# encoder is assumed, so video encodes on the CPU; any navigation camera
# is a USB UVC device.
video:
  csi_ports: 0
  encoder_api: "unknown"
  nav_cameras:
    csi_count: 0
    usb_uvc_count: 1
    recommended_role: nav-usb

# Conservative default: no VIO until the runtime confirms the hardware.
# Rangefinder lands on a USB serial adapter or an I2C bus; both paths are
# best-effort because the host is unknown.
navigation:
  vio_capable: false
  rangefinder_ports:
    - {type: uart, path: /dev/ttyUSB0, baud_max: 115200}
    - {type: i2c, path: /dev/i2c-1, speed_hz: 400000}
